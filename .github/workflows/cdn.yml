name: CDN

# Uploads the mushaf.js browser bundle to the R2 bucket behind cdn.mushafjs.com:
#   /mushaf.min.js, /mushaf.min.css      latest, cached 4 h
#   /v{version}/mushaf.min.js|css        pinned, cached forever
# Runs after a core publish (called from publish.yml), or manually from the
# branch/tag you pick. Needs the repository variable R2_BUCKET (the bucket name)
# and a CLOUDFLARE_API_TOKEN with Account › Workers R2 Storage › Edit. Set the
# variable R2_JURISDICTION (eu / fedramp) if the bucket was created in one.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Upload browser bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: packages/core
        run: npm run build

      - name: Upload to R2
        working-directory: packages/core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_JURISDICTION: ${{ vars.R2_JURISDICTION }}
        run: |
          : "${R2_BUCKET:?Set R2_BUCKET under Settings › Secrets and variables › Actions › Variables (repository variable, not a secret)}"
          version=$(node -p "require('./package.json').version")
          put() { # file, key, content type, cache control
            npx -y wrangler@4 r2 object put "$R2_BUCKET/$2" --remote \
              ${R2_JURISDICTION:+--jurisdiction "$R2_JURISDICTION"} \
              --file "$1" --content-type "$3" --cache-control "$4"
          }
          latest="public, max-age=14400"
          pinned="public, max-age=31536000, immutable"
          put dist/mushaf.min.js  "v$version/mushaf.min.js"  "application/javascript; charset=utf-8" "$pinned"
          put dist/mushaf.min.css "v$version/mushaf.min.css" "text/css; charset=utf-8"               "$pinned"
          put dist/mushaf.min.js  mushaf.min.js              "application/javascript; charset=utf-8" "$latest"
          put dist/mushaf.min.css mushaf.min.css             "text/css; charset=utf-8"               "$latest"
