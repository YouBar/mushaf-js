name: Publish to npm

# Publishes mushaf.js / @mushafjs/vue to the public npm registry, on a GitHub
# release (tag mushaf.js-vX.Y.Z or @mushafjs/vue-vX.Y.Z) or manually.
#
# Auth: npm trusted publishing (OIDC), configured on npmjs.com for this
# workflow file. No npm token is stored in the repo. The trusted publisher only
# allows staged publishing: this workflow stages the version, and a maintainer
# approves it with 2FA on npmjs.com (or `npm stage approve <id>`) to release it.
# For core it then uploads the browser bundle to the CDN (cdn.yml).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - core
          - vue

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    outputs:
      path: ${{ steps.pkg.outputs.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15+.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Detect package directory
        id: pkg
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$INPUT_PACKAGE" == "core" || "$TAG" == mushaf.js-v* ]]; then
            echo "path=packages/core" >> "$GITHUB_OUTPUT"
          elif [[ "$INPUT_PACKAGE" == "vue" || "$TAG" == @mushafjs/vue-v* ]]; then
            echo "path=packages/vue" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown package/tag: input='$INPUT_PACKAGE' tag='$TAG'" >&2
            exit 1
          fi

      - name: Test
        working-directory: ${{ steps.pkg.outputs.path }}
        run: npm test --if-present

      - name: Build
        working-directory: ${{ steps.pkg.outputs.path }}
        run: npm run build

      - name: Stage for approval
        working-directory: ${{ steps.pkg.outputs.path }}
        run: npm stage publish --access public

  cdn:
    name: Browser bundle to the CDN
    needs: publish
    if: needs.publish.outputs.path == 'packages/core'
    uses: ./.github/workflows/cdn.yml
    secrets: inherit
